<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion organisateur — Scrutin</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">
      <svg class="brand-seal" viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="18" stroke="#C9A227" stroke-width="2.4"/>
        <path d="M14 20l4 4 8-9" stroke="#8B2635" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-text">Scrutin<small>Espace organisateur</small></span>
    </a>
  </div>
</header>

<main class="center-screen">
  <div class="panel panel-narrow">
    <h2>Connexion organisateur</h2>
    <p style="font-size:.92rem;">Réservé aux membres habilités à administrer le scrutin.</p>

    <div id="alerte" class="alert alert-erreur hidden" role="alert"></div>

    <form id="form-admin-login" class="stack" style="gap:0;">
      <div class="field">
        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-secondary btn-block" id="btn-login">Se connecter</button>
    </form>
  </div>
</main>

<footer class="foot">Les comptes organisateurs sont créés depuis la console Firebase (Authentication).</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/utils.js"></script>
<script src="js/admin-login.js"></script>
</body>
</html>
