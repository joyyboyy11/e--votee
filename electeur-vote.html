<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voter — Scrutin</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">
      <svg class="brand-seal" viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="18" stroke="#C9A227" stroke-width="2.4"/>
        <path d="M14 20l4 4 8-9" stroke="#8B2635" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-text">Scrutin<small>Espace électeur</small></span>
    </a>
    <nav class="topbar-nav">
      <a href="index.html">Accueil</a>
      <a href="resultats.html">Résultats</a>
    </nav>
  </div>
</header>

<main class="container" style="padding-top:36px; padding-bottom:60px;">

  <div class="steps">
    <div class="step done"><span class="step-num">1</span> Identification</div>
    <div class="step-sep"></div>
    <div class="step active"><span class="step-num">2</span> Vote</div>
    <div class="step-sep"></div>
    <div class="step"><span class="step-num">3</span> Confirmation</div>
  </div>

  <div id="alerte" class="alert alert-erreur hidden" role="alert" style="max-width:640px;margin:0 auto 20px auto;"></div>

  <div id="zone-chargement" class="empty">Chargement du bulletin…</div>

  <div id="zone-vote" class="hidden" style="max-width:900px; margin:0 auto;">
    <h2 id="titre-election" style="text-align:center;"></h2>
    <p id="desc-election" style="text-align:center; max-width:560px; margin:0 auto 8px auto;"></p>
    <p style="text-align:center; font-size:.85rem; color:var(--gris-texte);">Sélectionnez un candidat, puis confirmez votre choix. Le vote est définitif et anonyme.</p>

    <div class="candidats-grid" id="liste-candidats"></div>

    <div style="text-align:center; margin-top:20px;">
      <button class="btn btn-primary" id="btn-voter" disabled>Confirmer mon vote</button>
    </div>
  </div>
</main>

<!-- Modal de confirmation -->
<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal">
    <h3>Confirmer votre vote</h3>
    <p>Vous avez choisi <strong id="modal-nom-candidat"></strong>. Ce choix est définitif et ne pourra pas être modifié.</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="btn-annuler-modal" style="flex:1;">Revenir</button>
      <button class="btn btn-primary" id="btn-confirmer-modal" style="flex:1;">Je confirme</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/utils.js"></script>
<script src="js/electeur-vote.js"></script>
</body>
</html>
