<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vote enregistré — Scrutin</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="center-screen">
  <div class="confirmation">
    <div class="seal seal-vert seal-lg">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <div class="steps" style="justify-content:center;">
      <div class="step done"><span class="step-num">1</span> Identification</div>
      <div class="step-sep"></div>
      <div class="step done"><span class="step-num">2</span> Vote</div>
      <div class="step-sep"></div>
      <div class="step active"><span class="step-num">3</span> Confirmation</div>
    </div>
    <h1 style="font-size:1.8rem;">Votre vote a été enregistré</h1>
    <p>Merci pour votre participation. Pour préserver le secret du scrutin, votre choix n'est ni affiché ni conservé nominativement — seul le décompte global est mis à jour.</p>
    <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
      <a href="index.html" class="btn btn-ghost">Retour à l'accueil</a>
      <a href="resultats.html" class="btn btn-primary">Voir les résultats</a>
    </div>
  </div>
</main>

<script>
  // Sécurité : si quelqu'un arrive directement sur cette page sans avoir voté,
  // rien de sensible n'y est exposé — c'est une simple page d'état.
</script>
</body>
</html>
